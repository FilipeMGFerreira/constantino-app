services:
  - type: web
    name: constantino-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: ENABLE_CRON
        value: 'true'

  - type: web
    name: constantino-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: constantino-recorrentes
    runtime: node
    plan: free
    rootDir: backend
    schedule: '0 6 * * *'
    buildCommand: echo ok
    startCommand: node -e "fetch((process.env.API_URL.startsWith('http')?process.env.API_URL:'https://'+process.env.API_URL)+'/api/cron/recorrentes',{method:'POST',headers:{'x-cron-secret':process.env.CRON_SECRET}}).then(r=>r.text()).then(console.log)"
    envVars:
      - key: API_URL
        fromService:
          name: constantino-api
          type: web
          property: host
      - key: CRON_SECRET
        sync: false
      - key: CRON_TOKEN
        sync: false
